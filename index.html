<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BACI — Business Acquisition &amp; Conversion Intelligence</title>
<style>
  :root { --gold:#C1922F; --gold-bright:#E6B84A; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:#000; color:#EDE6D6;
    font-family:"Helvetica Neue",Arial,sans-serif; -webkit-font-smoothing:antialiased; }

  /* Hero stage: the exact tile, scaling at any width; hotspots track it via % */
  .hero { width:100%; background:#000; display:flex; justify-content:center; }
  .stage { position:relative; width:100%; max-width:1400px; }
  .stage img { display:block; width:100%; height:auto; }

  /* Interactive overlay — invisible until hover/focus, positioned over baked elements */
  .hot { position:absolute; border:1px solid transparent; border-radius:6px;
    cursor:pointer; background:transparent; transition:.25s ease;
    display:block; text-indent:-9999px; overflow:hidden; }
  .hot:hover, .hot:focus-visible {
    border-color:rgba(193,146,47,.7);
    box-shadow:0 0 18px rgba(193,146,47,.35), inset 0 0 12px rgba(193,146,47,.15);
    outline:none; }

  /* Nav hotspots (%) */
  .h-logo    { left:1.2%;  top:2.4%;  width:14%;  height:7%; }
  .h-plat    { left:40.2%; top:4.2%;  width:7.2%; height:5%; }
  .h-modes   { left:49.4%; top:4.2%;  width:5.4%; height:5%; }
  .h-intel   { left:56.6%; top:4.2%;  width:9.6%; height:5%; }
  .h-about   { left:68.2%; top:4.2%;  width:6%;   height:5%; }
  .h-access  { left:76.2%; top:4.2%;  width:6.4%; height:5%; }
  .h-request { left:82.4%; top:3.6%;  width:16%;  height:6%;  border-radius:4px; }

  /* Watch the film — pulsing ring over the baked play circle */
  .h-film { left:14.8%; top:66.2%; width:6.2%; height:7.4%; border-radius:50%; }
  .h-film::after { content:""; position:absolute; inset:-6px; border-radius:50%;
    border:2px solid var(--gold); opacity:.0; animation:pulse 2.6s ease-out infinite; }
  @keyframes pulse { 0%{transform:scale(.85);opacity:.55} 70%{transform:scale(1.35);opacity:0} 100%{opacity:0} }

  /* HUD card hover regions — subtle glow, no layout change to the tile */
  .card { position:absolute; border-radius:8px; transition:.3s ease; pointer-events:none; }
  .card.glow:hover { box-shadow:0 0 26px rgba(193,146,47,.28); }

  /* Film modal */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.9); display:none;
    align-items:center; justify-content:center; z-index:50; }
  .modal.open { display:flex; }
  .film { width:min(90vw,960px); aspect-ratio:16/9; background:#0a0a0a;
    border:1px solid rgba(193,146,47,.4); border-radius:10px; display:flex;
    align-items:center; justify-content:center; color:var(--gold); letter-spacing:.15em;
    font-size:14px; box-shadow:0 0 60px rgba(193,146,47,.15); }
  .close { position:absolute; top:22px; right:26px; color:var(--gold); background:none;
    border:1px solid rgba(193,146,47,.5); border-radius:4px; padding:8px 14px;
    letter-spacing:.12em; cursor:pointer; font-size:12px; }

  /* Mobile: keep the exact tile, add a sticky Watch the Film CTA (hero invites) */
  .mobile-cta { display:none; }
  @media (max-width:760px){
    .mobile-cta { display:flex; position:sticky; bottom:0; z-index:20;
      justify-content:center; gap:10px; padding:14px; background:linear-gradient(#0000,#000 40%);
      align-items:center; }
    .mobile-cta button { background:transparent; color:var(--gold);
      border:1px solid var(--gold); border-radius:40px; padding:12px 26px;
      letter-spacing:.14em; font-size:13px; cursor:pointer; }
  }
</style>
</head>
<body>
  <section class="hero" aria-label="BACI hero">
    <div class="stage">
      <img src="hero.webp"
           alt="BACI — the future of growth is intelligence. Analysing millions of business signals in real time." />

      <!-- Interactive layer over the exact tile -->
      <a class="hot h-logo"    href="#top"          aria-label="BACI home">BACI</a>
      <a class="hot h-plat"    href="#platform"     aria-label="Platform">Platform</a>
      <a class="hot h-modes"   href="#modes"        aria-label="Modes">Modes</a>
      <a class="hot h-intel"   href="#intelligence" aria-label="Intelligence">Intelligence</a>
      <a class="hot h-about"   href="#about"        aria-label="About">About</a>
      <a class="hot h-access"  href="#access"       aria-label="Access">Access</a>
      <a class="hot h-request" href="#request"      aria-label="Request access">Request access</a>
      <button class="hot h-film" id="filmBtn" aria-label="Watch the film">Watch the film</button>
    </div>
  </section>

  <div class="mobile-cta"><button id="filmBtnMobile">Watch the film ▶</button></div>

  <div class="modal" id="filmModal" role="dialog" aria-modal="true" aria-label="BACI film">
    <button class="close" id="filmClose">CLOSE ✕</button>
    <div class="film">BACI FILM — add your video source here</div>
  </div>

  <script>
    const modal = document.getElementById('filmModal');
    const open = () => modal.classList.add('open');
    const close = () => modal.classList.remove('open');
    document.getElementById('filmBtn').addEventListener('click', open);
    document.getElementById('filmBtnMobile').addEventListener('click', open);
    document.getElementById('filmClose').addEventListener('click', close);
    modal.addEventListener('click', e => { if (e.target === modal) close(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  </script>
</body>
</html>
